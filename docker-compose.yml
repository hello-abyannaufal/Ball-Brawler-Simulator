# Single local PostgreSQL instance for development (Req 1.6).
# Host/port are configurable via the matching variables in .env / .env.example.
services:
  postgres:
    image: postgres:16-alpine
    container_name: ballbrawler-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ballbrawler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ballbrawler}
      POSTGRES_DB: ${POSTGRES_DB:-ballbrawler}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ballbrawler-pgdata:/var/lib/postgresql/data

volumes:
  ballbrawler-pgdata:
